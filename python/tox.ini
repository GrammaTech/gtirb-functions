######################################################
# tox environment configuration
######################################################
[tox]
requires =
    tox >= 4.26
    tox-uv >= 1.26
envlist =
    pyright-{oldest,newest}
    py3{11-15}-{oldest,newest}
    report

# Convenience labels for running oldest/newest/prerelease tests with all
# supported versions of python.
labels =
    oldest = pyright-oldest, py3{11-15}-oldest
    newest = pyright-newest, py3{11-15}-newest
    prerelease = pyright-prerelease, py3{11-15}-prerelease

[testenv]
package = wheel
setenv =
    COVERAGE_FILE = .coverage.{envname}
uv_resolution =
    !oldest: highest       # install the newest available versions
    oldest: lowest-direct  # install the oldest available versions
pip_pre =
    prerelease: true       # install pre-release versions
    !prerelease: false     # do not install pre-release versions

[testenv:pyright-{oldest,newest,prerelease}]
description = check types with pyright
passenv = PYRIGHT_PYTHON_CACHE_DIR
deps = -r requirements-dev.txt
commands = pyright

[testenv:{,junit-}py3{11-15}-{oldest,newest,prerelease}]
# Test environments for supported python versions. Use py3*-oldest to test using
# oldest supported dependencies, py3*-newest to test using the newest supported
# dependencies, and py3*-prerelease to test using prerelease dependency versions
# (if available).
description = run the tests with pytest under {envname}
deps = -r requirements-test.txt
commands =
    !junit: pytest {posargs:--cov --strict-markers}
    junit: pytest --junit-xml={envname}.xml --junit-prefix={envname} {posargs:--cov --strict-markers}

[testenv:report]
# Combine coverage reports.
description = report coverage from recent tests
depends = py3{11-15}-{oldest,newest,prerelease}
skip_install = true
deps = -r requirements-test.txt
setenv =
    COVERAGE_FILE = .coverage
commands =
    coverage combine
    # Always write the XML report.
    coverage xml --fail-under=0
    # Report to the terminal and fail if coverage is under threshold.
    coverage report
