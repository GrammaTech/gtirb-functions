variables:
  # The IMAGE_TAG is derived from the branch name so that if a branch modifies
  # the CI images, it builds and runs using the new images without conflicting
  # with master.
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_STRATEGY: clone
  CONAN_VERSION: "1.59"
  INTERNAL_PYPI: $CI_SERVER_HOST:$CI_SERVER_PORT/api/v4/projects/1587/packages/pypi
  PIP_INDEX_URL: https://__token__:$GL_PKG_API_TOKEN@$INTERNAL_PYPI/simple
  # Change cache directories to be inside the project since we can only cache
  # paths in the local working copy.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  PYRIGHT_PYTHON_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pyright"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"


stages:
  - build-images
  - check-format
  - build
  - test
  - publish

default:
  image: $DOCKER_REGISTRY/$CI_PROJECT_PATH/ubuntu22:$IMAGE_TAG
  tags: ['shared']
  cache:
    key: python-packages
    paths:
      - .cache
  before_script:
    - uv venv
    - uv pip install --index-url "$PIP_INDEX_URL" -r python/requirements-dev.txt

.build-ci-image: &build-ci-image
  stage: build-images
  image:
    name: quay.io/buildah/stable
  before_script:
    - ''
  script:
    # Configure authentication credentials for GitLab
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD" https://index.docker.io/v1/
    # Build our image (using a cache if available)
    - >-
      buildah build
      -f "$CI_PROJECT_DIR/$DOCKERFILE_PATH"
      --cache-from "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME/cache"
      --cache-to "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME/cache"
      --layers
      --tag "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG"
      "$CI_PROJECT_DIR"
    # Push to our internal registry
    - buildah push "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG"
    # If we're on the master branch, also push the latest tag.
    - >-
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah push "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG" \
            "$DOCKER_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:latest"
      fi

build-ci-image-ubuntu22:
  <<: *build-ci-image
  variables:
    DOCKERFILE_PATH: .ci/Dockerfile.ubuntu22
    IMAGE_NAME: ubuntu22

check-format:
  stage: check-format
  script:
    - uv pip install pre-commit
    - cd python
    - |+
      ../.venv/bin/pre-commit run --all-files --show-diff-on-failure || ( (cat <<EOF
      ================================================================================
      If this stage fails, the formatting of your changes may be incorrect.
      To automatically format your files, install pre-commit:
          pip3 install pre-commit
          pre-commit install
      pre-commit will now automatically format any files before commit.
      To fix any misformatted files, run:
          pre-commit run --all-files
      And then commit any changes.
      More information regarding pre-commit can be found at https://pre-commit.com.
      ================================================================================
      EOF
      ) && exit 1)


test:
  stage: test
  needs: [check-format]
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: python/junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: python/coverage.xml
  script:
    - cd python
    - ../.venv/bin/tox run

publish_external:
  stage: publish
  variables:
    TWINE_USER_NAME: __token__
    TWINE_PASSWORD: $PYPI_API_KEY
  script:
    - cd python
    - uv build .
    - source .venv/bin/activate
    - VERSION=$(python3 -c "import pkginfo, sys; print(pkginfo.Wheel(sys.argv[1]).version)" dist/*.whl)
    - if [[ "$VERSION" =~ \.dev ]]; then exit 1; fi
    - twine upload --verbose dist/*.whl
  rules:
    - if: '$PYPI_API_KEY && $CI_COMMIT_TAG =~ /^v[0-9.]+/'

publish_internal:
  stage: publish
  variables:
    TWINE_REPOSITORY_URL: https://$INTERNAL_PYPI
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $GL_PKG_API_TOKEN
  script:
    - cd python
    - uv build .
    - source .venv/bin/activate
    - twine upload --verbose dist/*.whl
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9.]+/'


.conan-template: &conan-template
  - uv pip install --upgrade conan~=$CONAN_VERSION
  - conan profile new default --detect
  - conan profile update settings.compiler.libcxx=libstdc++11 default
  - conan remote add gitlab ${CI_API_V4_URL}/packages/conan
  - export CONAN_PASSWORD="$CI_JOB_TOKEN"
  - conan user ci_user -r gitlab -p

.ubuntu-build-template: &ubuntu-build
  stage: build
  needs: [check-format]
  before_script: []
  script:
    - cd cpp
    - *conan-template
    - conan install .
    - python3 create-conan-package.py --build=missing

build-ubuntu22:
  <<: *ubuntu-build

coverage:
  stage: build
  needs: [check-format]
  artifacts:
    when: always
    reports:
      junit: cpp/build/report.xml
      coverage_report:
        coverage_format: cobertura
        path: cpp/build/coverage.xml
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  before_script: []
  script:
    - cd cpp
    - *conan-template
    - mkdir build
    - cd build
    - conan install ..
    - cmake -DENABLE_CODE_COVERAGE=ON -DGTIRB_FUNCTIONS_ENABLE_TESTS=ON -DENABLE_DEBUG=ON -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DENABLE_CONAN=ON ..
    - cmake --build .
    - ctest --output-on-failure --output-junit report.xml
    - cd ..
    - gcovr -e build --xml build/coverage.xml
    # Don't include coverage of the tests in the overall percentage
    - gcovr -e build -e '.*/test_.*' --fail-under-line 80 --txt
